name: Library Management CI

on:
  push:
  pull_request:

jobs:
  test-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        working-directory: Library_Practicum_10
        run: python -m unittest -v test_library
